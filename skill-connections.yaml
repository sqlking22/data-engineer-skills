# 数据开发工程师技能套件 - 联动配置
# 定义数据开发Skill生态中各Skill之间的输入输出关系

# ============================================================================
# 标准包格式规范
# ============================================================================
standard_packages:
  requirement_package:
    version: "1.0"
    required_fields: [version, metadata, business, functional, non_functional, specifications]
    metadata_fields: [project_name, generated_by, generated_at, confirmed]
    output_path: "outputs/requirement_package.yaml"

  modeling_package:
    version: "1.0"
    required_fields: [version, metadata, fact_tables, dimensions, schemas]
    metadata_fields: [project_name, generated_by, generated_at, upstream_package]
    output_path: "outputs/modeling_package.yaml"

  sql_package:
    version: "1.0"
    required_fields: [version, metadata, content, optimization]
    metadata_fields: [generated_by, generated_at, sql_dialect, query_purpose]
    optional_fields: [performance, downstream_specs]
    output_path: "outputs/sql_package.yaml"

  dq_package:
    version: "1.0"
    required_fields: [version, metadata, rules]
    metadata_fields: [generated_by, generated_at, target_table, check_scope]
    optional_fields: [check_results, data_dictionary, downstream_specs]
    output_path: "outputs/dq_package.yaml"

  test_package:
    version: "1.0"
    required_fields: [version, metadata, test_suites, summary]
    metadata_fields: [generated_by, generated_at, target_project, upstream_packages]
    optional_fields: [reports, downstream_specs]
    output_path: "outputs/test_package.yaml"

# ============================================================================
# Skill联动关系
# ============================================================================
skill_connections:
  version: "1.0"
  description: "数据开发Skill生态联动配置"

  # ============================================================================
  # Skill列表
  # ============================================================================
  skills:
    - id: requirement-analyst
      name: 需求分析助手
      entry: /requirement-analyst
      description: 端到端需求分析工作流

    - id: modeling-assistant
      name: 数据建模助手
      entry: /modeling-assistant
      description: 端到端数据建模工作流

    - id: sql-assistant
      name: SQL智能开发助手
      entry: /sql-assistant
      description: 端到端SQL开发工作流

    - id: dq-assistant
      name: 数据质量检查助手
      entry: /dq-assistant
      description: 端到端数据质量管理

    - id: test-engineer
      name: 测试工程师
      entry: /test-engineer
      description: 端到端数据仓库测试

    - id: dw-refactor-assistant
      name: 数仓重构助手
      entry: /dw-refactor-assistant
      description: 端到端数仓重构与治理工作流

  # ============================================================================
  # 联动关系定义
  # ============================================================================
  connections:
    # requirement-analyst 输出
    - from: requirement-analyst
      to: modeling-assistant
      input_file: requirement_package.yaml
      mapping:
        - "functional.entities → model_spec.entities"
        - "functional.metrics → model_spec.metrics"
        - "specifications.model_spec → model_design_input"
      auto_trigger: false
      command: "/modeling-assistant --from-requirement"

    - from: requirement-analyst
      to: sql-assistant
      input_file: requirement_package.yaml
      mapping:
        - "functional.metrics → query_requirements"
      auto_trigger: false
      command: "/sql-assistant --from-requirement"

    # modeling-assistant 输出
    - from: modeling-assistant
      to: sql-assistant
      input_file: modeling_package.yaml
      mapping:
        - "fact_tables → tables"
        - "dimensions → joins"
        - "schemas → ddl_input"
      auto_trigger: false
      command: "/sql-assistant --from-model"

    - from: modeling-assistant
      to: dq-assistant
      input_file: modeling_package.yaml
      mapping:
        - "schemas → table_schemas"
      auto_trigger: false
      command: "/dq-assistant --from-model"

    - from: modeling-assistant
      to: test-engineer
      input_file: modeling_package.yaml
      mapping:
        - "schemas → unit_test_fixtures"
      auto_trigger: false
      command: "/test-engineer --from-model"

    # sql-assistant 输出
    - from: sql-assistant
      to: dq-assistant
      input_file: sql_package.yaml
      mapping:
        - "ddl_files → schema_validation"
      auto_trigger: false
      command: "/dq-assistant --from-sql"

    - from: sql-assistant
      to: test-engineer
      input_file: sql_package.yaml
      mapping:
        - "sql_queries → performance_test_targets"
        - "execution_plans → optimization_hints"
      command: "/test-engineer --from-sql"

    # dq-assistant 输出
    - from: dq-assistant
      to: test-engineer
      input_file: dq_package.yaml
      mapping:
        - "rules → test_suites.unit_tests"
        - "check_results.violations → test_suites.integration_tests"
        - "data_dictionary → test_fixtures"
      auto_trigger: false
      command: "/test-engineer --from-dq"

    # test-engineer 输出：test_package.yaml 作为上线交付物
    # 测试通过门槛：overall_status == 'passed' AND block_deployment == false AND coverage > 80
    # 本套件未包含独立的部署/发布模块，发布由团队既有的发布流程（DataWorks/DolphinScheduler）承接

  # ============================================================================
  # 完整工作流定义
  # ============================================================================
  workflows:
    # 完整数据开发流程
    full_development_pipeline:
      name: 完整数据开发流程
      description: 需求分析 → 建模 → SQL → 质量 → 测试
      stages:
        - order: 0
          skill: requirement-analyst
          input: 原始业务需求
          output: requirement_package.yaml

        - order: 1
          skill: modeling-assistant
          input: requirement_package.yaml
          output: modeling_package.yaml

        - order: 2
          skill: sql-assistant
          input: modeling_package.yaml
          output: sql_package.yaml

        - order: 3
          skill: dq-assistant
          input: modeling_package.yaml
          output: dq_package.yaml

        - order: 4
          skill: test-engineer
          input: dq_package.yaml + modeling_package.yaml
          output: test_package.yaml

    # 建模到SQL开发
    modeling_to_sql:
      name: 建模到SQL
      description: 基于模型生成SQL
      stages:
        - order: 0
          skill: modeling-assistant
          input: 建模需求
          output: modeling_package.yaml

        - order: 1
          skill: sql-assistant
          input: modeling_package.yaml
          output: sql_package.yaml

        - order: 2
          skill: dq-assistant
          input: modeling_package.yaml
          output: dq_package.yaml

    # SQL开发到测试
    sql_to_test:
      name: SQL开发到测试
      description: SQL开发 → 质量检查 → 测试验证
      stages:
        - order: 0
          skill: sql-assistant
          input: SQL开发需求
          output: sql_package.yaml

        - order: 1
          skill: dq-assistant
          input: sql_package.yaml
          output: dq_package.yaml

        - order: 2
          skill: test-engineer
          input: dq_package.yaml
          output: test_package.yaml

    # 质量到测试
    quality_to_test:
      name: 质量到测试
      description: 基于质量规则生成测试
      stages:
        - order: 0
          skill: dq-assistant
          input: 表Schema
          output: dq_package.yaml

        - order: 1
          skill: test-engineer
          input: dq_package.yaml
          output: test_package.yaml

  # ============================================================================
  # 上下文传递协议
  # ============================================================================
  context_protocol:
    shared_fields:
      - schema_info
      - sql_snippet
      - quality_rules

    package_format:
      version: "1.0"
      metadata:
        project_name: string
        generated_by: string
        generated_at: timestamp
        upstream_package: string
      content: object
      downstream_specs: array

  # ============================================================================
  # 快捷命令
  # ============================================================================
  shortcuts:
    - name: 完整开发流程
      command: "/skill-hub 端到端开发：{业务场景}"
      workflow: full_development_pipeline

    - name: 快速建模开发
      command: "/modeling-assistant → /sql-assistant → /dq-assistant"
      workflow: modeling_to_sql

    - name: SQL开发测试
      command: "/sql-assistant → /dq-assistant → /test-engineer"
      workflow: sql_to_test

    - name: 质量测试
      command: "/dq-assistant → /test-engineer"
      workflow: quality_to_test